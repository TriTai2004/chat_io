<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
</head>
<body>

<h2>Spring WebSocket Test</h2>

<button onclick="login()">Login</button>
<button onclick="connect()">Connect</button>
<button onclick="subscribeConversation()">Subscribe</button>
<button onclick="sendMessage()">Send Message</button>

<br><br>

<input id="content" placeholder="Message content" value="Hello">

<pre id="log"></pre>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>

    let stompClient = null;

    function log(message) {
        document.getElementById("log").textContent += message + "\n";
    }

    // ===================== LOGIN =====================
    async function login() {

        try {
            const response = await fetch("http://localhost:8080/api/v1/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include", // QUAN TRỌNG để nhận HttpOnly cookie
                body: JSON.stringify({
                    email: "taidfod@gmail.com",
                    password: "123456"
                })
            });

            const data = await response.json();

            log("Login success");
            log(JSON.stringify(data));

        } catch (error) {
            log("Login failed: " + error);
        }
    }

    // ===================== CONNECT WS =====================
    function connect() {

        const socket = new SockJS("http://localhost:8080/ws", null, {
            withCredentials: true
        });

        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {
            log("Connected");
        }, function (error) {
            log("Connection error: " + error);
        });
    }

    // ===================== SUBSCRIBE =====================
    function subscribeConversation() {

        stompClient.subscribe(
            "/user/queue/messages",
            function (message) {
                log("Received: " + message.body);
            }
        );

        log("Subscribed: /topic/conversations/1");
    }

    // ===================== SEND MESSAGE =====================
    function sendMessage() {

        const content = document.getElementById("content").value;

        stompClient.send(
            "/app/chat.send",
            {},
            JSON.stringify({
                conversationId: 2,
                    senderId: 1,
                content: content
            })
        );

        log("Sent: " + content);
    }

</script>

</body>
</html>
